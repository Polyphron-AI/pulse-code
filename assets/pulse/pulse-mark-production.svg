<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Pulse Next">
  <title>Pulse Next</title>
  <!-- Hand-authored source of truth for the Pulse Next mark. Every raster slot
       is rendered from this file by scripts/generate-pulse-brand-icons.ts.
       Three capsule bars, short/tall/medium, all centred on y=512. Capsules are
       the shape class that survives downsampling to 16px: no thin strokes, no
       counters, nothing smaller than a ninth of the canvas. -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#0A0A0B" />
  <g fill="#00FF88">
    <rect x="230" y="362" width="132" height="300" rx="66" ry="66" />
    <rect x="446" y="202" width="132" height="620" rx="66" ry="66" />
    <rect x="662" y="300" width="132" height="424" rx="66" ry="66" />
  </g>
</svg>
