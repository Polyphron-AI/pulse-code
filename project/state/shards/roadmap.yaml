      - "2026-08-20 reference adapter landed and its shared lifecycle wrapper verified; roadmap remains active pending release and metric evidence."

  - id: R-2026-08-19-agent-context-actions
    title: "Agent-readable context and deliberate actions"
    theme: T1
    horizon: now
    stage: shaped
    kind: feature
    outcome: "Minimize manual copying of external work into coding threads without increasing unauthorized provider writes."
    need: "When I ask an agent to investigate or fix external work, I want it to receive mapped, fresh, bounded context and preview any write, so I can move quickly without surrendering control."
    directions:
      - "Expose typed context resources and action-preview/execute RPCs through domain-specific tools."
      - "Keep integrations user-facing only and ask users to paste selected context into threads."
    failure_mode: "Convenient context silently becomes ambient credential access or unbounded prompt material."
    appetite: "one walking-skeleton cycle after the reference adapter is stable"
    approach: "Start with Issue context plus one reversible action preview and receipt; expand by capability."
    rabbit_holes:
      - "generic autonomous workflow engine"
      - "policy language before one confirmed action path exists"
    no_gos:
      - "no secrets in tool output, prompts, checkpoints, or thread exports"
      - "no agent mutation without an explicit preview in the first release"
      - "no bulk actions"
    dod:
      - "Context includes provider, environment, mapping, stable identity, source, freshness, and summary/detail status."
      - "One agent-proposed mutation produces preview, confirmation, typed receipt, refresh, and conflict recovery."
      - "Unsupported/older environments never receive unknown calls."
    evidence:
      - {
          type: user_evidence,
          note: "The user explicitly asked that the assistant see appropriate tickets, bugs, projects, workspaces, and tokenizer context.",
        }
      - {
          type: plans_estimates,
          note: "The workflow and tool-flow artifacts define the bounded read and confirmation path.",
        }
      - {
          type: test_results,
          note: "T7/T11/T12 verify bounded Issue summary/detail context, session-scoped status previews, explicit confirmation receipts, typed RPC transport, and scoped client refresh.",
        }
    rice: { reach: H, impact: H, effort: M }
    prd_refs:
