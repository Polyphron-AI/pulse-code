          type: anecdotal,
          note: "Repository inspection found a full uncommitted native Issues contract, server adapter, settings flow, routes, mobile surface, and architecture guide.",
        }
      - {
          type: plans_estimates,
          note: "Existing docs define bounded evidence, mapping, optimistic versions, capability skew, and remote failure isolation.",
        }
      - {
          type: test_results,
          note: "Native Issues landed independently at ac8d94397 after 10 files/36 tests plus web/mobile typechecks; T4 then passed 6 files/38 adapter/store/domain tests.",
        }
    rice: { reach: M, impact: H, effort: M }
    prd_refs:
