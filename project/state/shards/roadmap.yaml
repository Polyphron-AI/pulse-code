    theme: T1
    horizon: now
    stage: shaped
    kind: feature
    outcome: "Minimize time from opening a Pulse Issue or Report to starting or resuming a correctly linked fix."
    need: "When a Pulse bug or ticket needs engineering work, I want native bounded evidence and a durable fix-thread link, so I can act without recreating the report in Pulse Code."
    directions:
      - "Complete and verify the current native Pulse Issues adapter, then wrap its lifecycle in shared primitives."
      - "Keep Pulse Issues standalone until a second adapter proves which primitives are truly shared."
    failure_mode: "Platform extraction destabilizes the large in-flight Issues feature or treats unmerged contracts as settled."
    appetite: "one focused stabilization cycle"
    approach: "Land and verify native Issues independently, preserve its domain contracts, then extract only demonstrated lifecycle seams."
    rabbit_holes:
      - "rewriting Issues UI during platform extraction"
      - "eagerly loading full Report evidence"
    no_gos:
      - "no embedded Pulse dashboard"
      - "no credential or evidence payload copied into agent prompts"
      - "no coupled merge with the foundation if Issues is not independently green"
    dod:
      - "Connection, mapping, list/detail, evidence, triage, capture, and fix-thread paths have focused tests."
      - "Web/desktop/mobile and mixed-capability behavior match the native Issues contract."
      - "Reference-adapter seams and provider-specific semantics are documented."
    evidence:
