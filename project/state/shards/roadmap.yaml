  - id: R-2026-08-22-document-link-durability
    title: Durable document links
    theme: T1
    horizon: now
    stage: shaped
    kind: feature
    outcome: Let a user open a linked project document days later from a phone on a tunnelled connection, or learn precisely why they cannot.
    need: When I open an old thread away from my machine, I want the documents it links to still open, and I want to know what the tap will cost before it starts.
    directions:
      - Treat a document link as a thread-plus-path reference that is re-resolved and re-streamed on every tap.
      - Issue download capabilities for any regular workspace file, bounded to one exact non-dot path.
      - Present name, size, progress, cancellation, and a distinct state for a document that is gone.
    failure_mode: The link only works while the message is fresh, every failure reads the same, or a tunnelled phone starts a large transfer with no warning and no way out.
    appetite: one focused capability and mobile cycle
    approach: Add an optional download intent to the workspace-file asset, return size and media type from the mint, and make the mobile sheet type-aware with progress and cancel.
    rabbit_holes:
      - server-side artifact store, retention windows, or garbage collection
      - serving a document as of a past turn from checkpoint refs
      - hand-authoring and regenerating document icon art, which is gated on a macOS-only rasterization step
    no_gos:
      - no capability outside the thread workspace root, no dot-prefixed path segments, no sibling reach from a download claim
      - no required contract change for existing asset callers
      - no change to web, desktop, or Files-tab behavior
    dod:
      - A link to a non-previewable document opens through the native chooser on local, remote/relay, and tunnel connections.
      - A document that is no longer in the project reports that distinctly from a disconnected environment or a missing app.
      - Large transfers state their size before starting and can be cancelled.
      - Focused server and mobile tests plus contracts, server, and mobile typechecks pass.
      - docs/user records the behavior and docs/internals records asset intents.
    evidence:
      - type: user_evidence
        note: The user asked on 2026-08-22 for document links that still open five days later, re-streaming the original, presented for a phone connected over a tunnel, and chose re-resolution over a durable artifact store.
      - type: repository_evidence
        note: The capability gate rejects every non-browser-previewable type, mobile collapses all failures into one alert, and progress plus cancellation already exist on the download call mobile makes.
    rice: { reach: M, impact: L, effort: M }
    prd_refs:
      - 14-document-link-durability#durable-reference
      - 14-document-link-durability#any-document
      - 14-document-link-durability#honest-state
      - 14-document-link-durability#remote-aware-presentation
    blocked_by: []
    metric:
      {
        name: linked documents openable from mobile after the thread goes cold,
        baseline: null,
        target: 100,
      }
    status: active
    history:
      - 2026-08-22 created in now as a continuation of R-2026-08-21-mobile-file-link-actions rather than a new slot claim; it reopens that item's persistent-download rabbit hole with a no-storage approach and awaits design approval before build.

  - id: R-2026-08-22-desktop-update-rollback
    title: Desktop in-app update with safe rollback
    theme: T2
    horizon: now
    stage: building
    kind: protective
    outcome: Let a desktop user recover from a bad update by reinstalling a previous version from inside the app, reachable as long as the app launches.
    need: When an update breaks my workflow, I want to pick an earlier version and restart into it without hunting for old installers, even if the update broke the main window.
    directions:
      - Pin the updater feed to a chosen GitHub release and reuse the existing download-confirm-install path for downgrades.
      - Keep rollback reachable from the native application menu, owned by the main process, independent of renderer and backend health.
      - A follow-up slice may add pre-update database snapshots with restore for downgrades across schema changes.
    failure_mode: A downgrade lands on a version that predates the Pulse install identity or cannot read current data, or the rollback UI itself lives only in the surface a bad update breaks.
    appetite: one focused desktop cycle
    approach: Feed pinning with allow-downgrade and full downloads, a compile-time minimum-version floor, same-channel filtering, and automatic pin reset on any normal check, channel switch, or error.
    rabbit_holes:
      - differential downgrade downloads
      - a second installer mechanism beside electron-updater
      - mobile or CLI-server rollback (stores and npx t3@<version> already own those)
    no_gos:
      - no version below the data-safety floor, ever
      - no cross-channel versions in the rollback list
      - no silent install; the app keeps running until the user confirms
    dod:
      - A desktop user can pick a previous same-channel version in Settings → About, confirm, and restart into it with projects, threads, and settings intact.
      - Roll Back to Previous Version and Install Downloaded Update work from the native Help menu with the renderer or backend unavailable.
      - Rollback never offers a version below the minimum-version floor, and a fresh check, channel switch, or failed check restores the normal update feed.
      - Focused desktop and web tests plus contracts, desktop, and web typechecks pass.
      - docs/user/updating.md explains rollback and both places to find it.
    evidence:
      - type: user_evidence
        note: The maintainer asked on 2026-08-22 for a self-contained update popup plus rollback to previous versions, reachable as long as Pulse Code launches, and directed the build with Proceed.
      - type: repository_evidence
        note: Forward self-update, channels, and the About-panel update flow already existed; rollback, the 0.0.34 floor, the Settings rollback row, and the Help-menu safe-mode items are implemented in the working tree with 67 focused tests passing.
    rice: { reach: H, impact: H, effort: M }
    prd_refs:
      - 15-desktop-update-rollback#rollback-choice
      - 15-desktop-update-rollback#crash-proof-path
      - 15-desktop-update-rollback#data-safety-floor
      - 15-desktop-update-rollback#channel-integrity
    blocked_by: []
    metric:
      { name: bad desktop updates recoverable without leaving the app, baseline: 0, target: 100 }
    status: active
    history:
      - 2026-08-22 created in now after the maintainer directed the build; Phase 1 (rollback machinery, floor, Settings row, Help-menu safe mode, user docs) is implemented and verified in the working tree. Pre-update snapshot/restore remains an unshaped follow-up slice.

