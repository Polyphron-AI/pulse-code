      - "2026-08-20 bounded Issue context and one confirmed status action are technically verified; automatic agent-tool exposure and additional domains remain outside this slice."

  - id: R-2026-08-19-integration-compatibility-safety
    title: "Compatibility and credential-safety gate"
    theme: T2
    horizon: now
    stage: shaped
    kind: protective
    outcome: "Minimize credential exposure and mixed-version connection failures across every client and remote mode."
    need: "When I upgrade one Pulse Code client or server, I want existing pairing, mobile connections, credentials, and provider workflows to keep working, so an integration release cannot strand my environment."
    directions:
      - "Add an additive capability-skew matrix, secret redaction checks, and migration compatibility fixtures."
      - "Version an entirely separate integration transport and require coordinated client/server upgrades."
    failure_mode: "Happy-path provider tests pass while mobile, relay/tunnel, old servers, or legacy Pulse/T3 identities break."
    appetite: "one protective slot in every integration implementation cycle"
    approach: "Make compatibility and secret non-disclosure receipts part of each adapter's release gate."
    rabbit_holes:
      - "repository-wide compatibility framework unrelated to integrations"
      - "centralized auth service"
    no_gos:
      - "no removal of shared web/mobile aliases, package IDs, pairing shapes, or stored identifiers; the locked desktop product boundary is explicitly separate"
      - "no release gate based only on web/local testing"
    dod:
      - "Old-client/new-server and new-client/old-server capability tests pass."
      - "Local, direct-remote, relay, tunnel, and mobile paths never receive provider credentials."
      - "Disconnect, revocation, rollback, and migration fixtures prove reversible behavior."
    evidence:
      - {
          type: user_evidence,
          note: "The user made full backwards compatibility an explicit condition of the Pulse Code rename and integration goal.",
        }
      - {
          type: anecdotal,
          note: "AGENTS.md identifies multi-surface and remote-ready omissions as a recurring defect class.",
        }
      - {
          type: test_results,
          note: "T8 passed 9 files/45 tests, contracts/client-runtime/mobile typechecks, and generated all Expo variants while preserving legacy schemes, catalog aliases, bundle/package IDs, environment identity, native RPC aliases, and persisted resource IDs.",
        }
    rice: { reach: H, impact: H, effort: M }
    prd_refs:
      - 10-pulse-integrations#security-privacy-and-compatibility
      - 20-acceptance-criteria/integration-foundation#integration-foundation-acceptance-criteria
    blocked_by:
      - R-2026-08-19-integration-foundation
    metric: { name: "integration compatibility regressions", baseline: 0, target: 0 }
    status: active
    history:
      - "2026-08-19 created in now as the reserved protective outcome."
      - "2026-08-20 compatibility matrix verified with zero detected regressions; item remains active until the integration work is committed/released and post-release metric evidence exists."

  - id: R-2026-08-21-scheduled-chats
    title: "Scheduled Chats daily check-in loop"
    theme: T1
    horizon: next
    stage: shaped
    kind: feature
    outcome: "Minimize the daily manual reconstruction of project state by running one bounded, reviewable agent check-in per schedule."
    need: "When I start my day, I want a scheduled agent run to have already read yesterday's handoff and written today's briefing, so I begin working instead of reconstructing."
    directions:
      - "Event-sourced schedules with a dumb sweep reactor; occurrence = a turn in one persistent thread; fresh provider session per fire with the handoff file as the only carried context."
      - "Project scope plus environment scope fanning out one turn per targeted repo."
    failure_mode: "The daily check-in grows into a generic autonomous workflow engine, or unattended runs become silent, unbounded, or double-fired."
    appetite: "one walking-skeleton cycle (contracts/decider/reactor) plus one UI cycle"
    approach: "Decider-enforced exactly-once, server-enforced time leashes, pre-flight auth probe, and per-turn checkpoint diffs as the preview story; single editor in Settings, threads inline."
    rabbit_holes:
      - "cron expressions and event triggers"
      - "run chaining and multi-step automations"
      - "notification fan-out (belongs to collaboration-notifications)"
    no_gos:
      - "no unpreviewable mutation: every run keeps an ordinary reviewable checkpoint diff"
      - "no canned mutation prompts shipped by Pulse Code"
      - "no silent skips: every non-run is a visible failed occurrence with a reason"
    dod:
      - "Schedules, occurrences, and thread origin are typed contracts; exactly-once proven by decider tests across restart/double-tick/catch-up."
      - "Time leashes interrupt through the normal turn-interrupt path; timeout writes no handoff."
      - "Web/desktop editor at Settings → Scheduled Chats, mobile settings-stack editor, inline badged threads, pause/resume/delete everywhere shown."
      - "Per-provider scheduled-run support is a stated decision per adapter."
      - "docs/user page states the host-availability constraint plainly."
    evidence:
      - {
          type: user_evidence,
          note: "The maintainer specified the daily check-in loop, handoff-file memory, persistent thread, fresh sessions, run/turn limits, and multi-repo scope in the 2026-08-21 design session.",
        }
      - {
          type: plans_estimates,
          note: "docs/plans/2026-08-21-scheduled-chats-design.md decides the domain model, scheduler mechanics, limits, scopes, and UI; PRD 12 and CR-2026-08-21-scheduled-chats carry the requirement.",
        }
    rice: { reach: H, impact: H, effort: M }
    prd_refs:
      - 12-scheduled-chats#daily-loop
      - 12-scheduled-chats#trust-rails
      - 12-scheduled-chats#surfaces
