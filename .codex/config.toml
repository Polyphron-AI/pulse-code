# Project MCP servers only. Model, effort, sandbox and approvals_reviewer come from
# the Codex home config; the expected Pulse baseline is documented under
# "Codex configuration for Pulse threads" in docs/operations/pulse-feature-delivery.md.

[mcp_servers.xcodebuildmcp]
enabled = true
required = false
command = "npx"
args = ["--yes", "xcodebuildmcp@2.6.2", "mcp"]
startup_timeout_sec = 20.0

[mcp_servers.xcodebuildmcp.env]
XCODEBUILDMCP_ENABLED_WORKFLOWS = "simulator,ui-automation,debugging,logging"
